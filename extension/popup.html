<!DOCTYPE html>
<html lang="en">
<head>
  <script src="config.js"></script>
  <meta charset="utf-8" />
  <title>Icloud HME</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- Header -->
  <header class="popup-header">
    <div class="header-left">
      <div id="acc-count-badge" class="header-pill" title="Total active addresses">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        <span id="acc-count-val">0</span>
      </div>
    </div>
    <div class="header-right">
      <button id="back-search-btn" class="icon-btn hidden" title="Back" aria-label="Back">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>
      <button id="search-btn" class="icon-btn" title="Search my addresses" aria-label="Search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
        </svg>
      </button>
      <div id="pool-badge" class="header-pill" title="Reserve Pool Status">
        <span id="pool-dot" class="dot"></span>
        <span id="pool-text">…</span>
      </div>
      <button id="gear-btn" class="icon-btn" title="Settings" aria-label="Settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
      </button>
      <button id="open-web-btn" class="icon-btn" title="Open Web Dashboard" aria-label="Open Web Dashboard">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="main-view">
    <!-- View A: Claim View -->
    <div id="claim-view">
      <!-- Claim Form -->
      <form id="claim-form">
        <div class="field">
          <label for="label-input">Address Label</label>
          <input type="text" id="label-input" placeholder="e.g. github.com…" autofocus />
        </div>
        <button type="submit" id="claim-btn" class="btn primary-btn btn-block">
          <span>Claim</span>
        </button>
      </form>

      <!-- Success Result Card -->
      <div id="result-card" class="result-card hidden">
        <div class="result-header">
          <span class="result-status">✓ Claimed & Copied</span>
          <span id="remaining-pool" class="remaining-pool">9/10 in reserve</span>
        </div>
        <div class="result-email-box">
          <span id="result-email" class="result-email">…</span>
          <button id="pwd-result-btn" class="action-icon-btn pwd-btn" title="Password (Click to view or generate)" aria-label="Password">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="7.5" cy="15.5" r="5.5"></circle>
              <path d="m21 2-9.6 9.6"></path>
              <path d="m15.5 7.5 3 3L22 7l-3-3"></path>
            </svg>
          </button>
          <button id="copy-result-btn" class="action-icon-btn copy-btn" title="Copy" aria-label="Copy">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Recent History -->
      <div class="history-section">
        <div class="history-title-row">
          <span>Recently Claimed</span>
        </div>
        <div id="history-list" class="history-list">
          <div class="history-empty">No recent addresses</div>
        </div>
      </div>
    </div>

    <!-- View B: Search / All Addresses View -->
    <div id="search-view" class="hidden">
      <div class="search-input-wrap">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="search-input-icon">
          <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
        </svg>
        <input type="text" id="search-input" placeholder="Search by name or email…" />
      </div>
      <div id="search-results-list" class="search-results-list">
        <div class="history-empty">Loading…</div>
      </div>
    </div>

    <!-- View C: Inline Settings View -->
    <div id="settings-view" class="hidden">
      <div class="settings-header-bar">
        <span class="settings-title">Extension Settings</span>
      </div>
      <form id="settings-form">
        <div class="field">
          <label for="settings-server-url">Server URL</label>
          <input type="url" id="settings-server-url" placeholder="http://127.0.0.1:8001" required />
          <span class="field-hint">Tailscale IP or local IP of the v3 server</span>
        </div>
        <div class="field">
          <label for="settings-api-key">API Key</label>
          <input type="password" id="settings-api-key" placeholder="ihme_live_…" required />
          <span class="field-hint">Generated in dashboard (Chrome Extension tab)</span>
        </div>

        <div id="settings-status-box" class="settings-status-box hidden"></div>

        <div class="settings-btn-row">
          <button type="button" id="settings-test-btn" class="btn secondary-btn btn-sm">Test</button>
          <button type="submit" id="settings-save-btn" class="btn primary-btn btn-sm">Save</button>
        </div>
      </form>
    </div>
  </main>

  <!-- Confirmation Modal (Permanent Delete) -->
  <div id="confirm-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-icon-danger">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <h3 class="modal-title">Delete permanently</h3>
      <p class="modal-message">Are you sure you want to permanently delete this email?</p>
      <div class="modal-email-preview" id="modal-email-target">…</div>
      <div class="modal-actions">
        <button type="button" id="modal-cancel-btn" class="btn secondary-btn btn-sm">Cancel</button>
        <button type="button" id="modal-confirm-btn" class="btn danger-btn btn-sm">Delete permanently</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
